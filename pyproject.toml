[project]
name = "autotelic-goal-critic"
version = "0.0.0"
description = "Does a goal generator with an independent Goldilocks critic produce more learning progress than uniform random goal sampling at a matched interaction budget?"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "ruff",
  "mypy",
  "radon",
  "bandit",
  "pylint",
  "vulture",
  "import-linter",
  "pytest",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "BLE", "TRY", "SIM"]
# TRY003 wants every raise's message defined on a custom exception class. In a project this
# size that abstraction has no scenario requiring it (rule R5) — the inline message is what a
# reader of the traceback actually sees.
ignore = ["TRY003"]

[tool.ruff.lint.per-file-ignores]
# assert is the pytest idiom: it is the pass/fail signal, not error handling.
"tests/*.py" = ["S101"]

[tool.mypy]
strict = true

[tool.bandit]
exclude_dirs = ["tests"]

[tool.pylint."messages control"]
disable = ["all"]
enable = ["duplicate-code"]

[tool.vulture]
paths = ["src"]

[tool.importlinter]
root_package = "autotelic_goal_critic"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autotelic_goal_critic"]
