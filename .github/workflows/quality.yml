name: quality

on:
  push:
    branches: [master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks scans history, so the checkout cannot be shallow.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10
        with:
          # Pinned so the proof of concept's random draws are reproducible in CI as well as
          # locally; the harness is only reproducible against the interpreter it was run on.
          python-version: "3.13"

      - name: install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - run: make setup
      - run: make quality
      - run: make test

      - name: the proof of concept reproduces the committed data byte for byte
        run: |
          make poc
          git diff --exit-code -- evidence-data/E-002-poc-runs.json
