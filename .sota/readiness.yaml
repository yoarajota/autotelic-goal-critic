  notes: 'The concept component is the generator + critic selection mechanism, scored at TRL 2: the mechanism
    is specified (a proposer, an outcome-based rater, a minimum-sample rule that separates unrated from
    impossible, and a selection rule over goal-space regions), the application is specified (a tabular
    goal-conditioned learner with hindsight relabelling in a discrete gridworld, inputs and outputs and
    the target problem class named), and the baseline is named at a version (HER, arXiv:1707.01495v3).
    TRL 1 is satisfied by E-001 (the source survey: primary sources read, mechanism described, H-001 stated
    and falsifiable). There is no experimental support yet, and no runnable artefact — TRL 3 requires
    a command that exits 0 and an observed result to compare against the analytical prediction, which
    is P2 work.

    '
