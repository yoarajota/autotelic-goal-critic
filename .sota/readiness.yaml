  notes: 'The concept component is the generator + critic selection mechanism, scored at TRL 3, and this
    is the honest ceiling for a probe that waives G3-G5: those gates are the evidence TRL 4+ requires.
    TRL 1-2 rest on E-001 (primary sources read; mechanism, application and named baseline specified).
    TRL 3 rests on E-002: the proof of concept in poc/ runs the critical function from one command that
    exits 0, in a surrogate environment, and its observed result is recorded and compared against the
    analytical prediction from P1. E-002 also falsifies H-001 in this domain, so the level describes what
    was built and measured, not a validated mechanism. Re-entering at P3 later would mean clearing the
    waivers and supplying exactly the missing artefacts: an explicit public interface, conformance and
    failure-mode tests, and a green ISO 5055 gate.'
