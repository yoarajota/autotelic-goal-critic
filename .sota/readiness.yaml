data_dependencies: 'No external dataset. All data is generated by the experiment''s own discrete gridworld
  and by the learner''s interactions with it: transition counts, goal-achievement outcomes (success/failure
  per attempted goal), and hindsight-relabelled outcomes for states reached. The environment, the map
  layout, the reachable/unreachable goal partition, the initial-state distribution and the relabelling
  strategy are versioned in the repository together with the code that produces them, and every run records
  its seed. Nothing is downloaded, so there is no dataset version to pin beyond the repository''s own
  commit.

  '
feedback_loops: 'The mechanism is a feedback loop by construction, and the loop is the object of study:
  selection changes which goals are practised, practising changes the measured competence per goal, the
  competence window changes the learning-progress estimate, and that estimate changes the next selection.
  Two consequences are named here rather than left implicit. First, the loop can close on itself — a goal
  whose competence is mis-estimated as partially learned attracts more practice, which produces more samples
  of the same mis-estimated goal region — which is why the rating is computed from environment outcomes
  and not from the learner''s own value estimates. Second, the absolute value of learning progress deliberately
  pulls attention back to regions whose competence has started to fall, which makes the selection distribution
  non-stationary even in a static environment. Nothing here is deployed against real users; the loop exists
  only inside a run.

  '
drift_detection: 'What drifts inside a run: the competence estimate for a goal region as the learner improves,
  and therefore the learning-progress estimate and the selection distribution. That drift is the signal,
  not a fault, and it is detected by the windowed competence measure itself. What drifts across runs and
  would silently invalidate a comparison: the gridworld layout and goal partition, the reachable/unreachable
  classification, the relabelling count, the exploration floor, the evaluation goal set, and the seed.
  All of these are pinned in the repository and recorded per run; the held-out evaluation goals are fixed
  before training and are never sampled during it. A run whose environment hash differs from the declared
  one is reported as a mismatched environment instead of being pooled with the rest.

  '
