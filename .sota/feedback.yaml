# Concept friction notes — recorded while working this repository.
# Review periodically; each entry names the check or rule it concerns.
entries:
- id: F-001
  date: '2026-09-16'
  kind: tool-gap
  rule: evidence commands
  project: autotelic-goal-critic
  summary: 'Recorded evidence commands are executed with /bin/sh, but nothing in the evidence-entry template
    says so. A block that begins with ''set -euo pipefail'' — the normal defensive prefix, and bash on
    the author''s machine — fails with ''/bin/sh: 2: set: Illegal option -o pipefail'' (exit 2) and is
    reported as a broken evidence entry, although the same command succeeds when run by hand.'
  suggestion: 'State the shell next to the fenced-block requirement in the evidence-entry template, or
    execute the blocks with bash when it is available. A template-level note is enough: the failure is
    confusing precisely because the command works interactively.'
  resolved: false
- id: F-002
  date: '2026-09-16'
  kind: false-positive
  rule: G1
  project: autotelic-goal-critic
  summary: The check that requires a failure-modes section in docs/01-theory.md matches an unnumbered
    heading, while the heading the theory template ships is numbered. A repository that fills the template
    exactly as generated fails its own gate with 'docs/01-theory.md has no failure-modes section', and
    the fix — renaming the heading, which breaks the template's section numbering — is not discoverable
    from the template text.
  suggestion: Match the heading with a pattern that tolerates optional numbering, and add a test asserting
    that the template a repository is generated from satisfies the check the repository is then held to.
  resolved: false
- id: F-003
  date: '2026-09-16'
  kind: missing-check
  rule: friction recording
  project: autotelic-goal-critic
  summary: 'Recording a friction entry derives its next ID from the file''s current content and then rewrites
    the whole file, with no lock and no re-read before writing. Two additions invoked in parallel both
    compute the same ID from the same state, and the second write clobbers the first: one entry is lost,
    and the file is left with orphaned lines that still parse, so the loss is silent. Triggered here by
    two parallel invocations of the same command.'
  suggestion: Re-read and re-validate the file immediately before writing, append instead of rewriting,
    or take a lock around the read-modify-write; and fail loudly if the on-disk content changed since
    the read rather than overwriting it.
  resolved: false
- id: F-004
  date: '2026-09-16'
  kind: rule-confusion
  rule: repository decoupling
  project: autotelic-goal-critic
  summary: 'Publishing a repository generated by this workflow puts two of its own requirements in conflict:
    the friction notes above must describe checks inside the tooling that owns the workflow, while the
    repository is required to reference none of that tooling. Neutral wording covers the entries here,
    but the tension is structural rather than incidental, so every published repository carrying such
    a log will keep hitting it. The alternative — excluding the friction file from publication — loses
    the record the workflow reads back.'
  suggestion: 'Decide explicitly which side wins for a published repository: keep friction notes in a
    location that is not published, or accept the neutral wording as the standard and state it where the
    file is defined.'
  resolved: false
